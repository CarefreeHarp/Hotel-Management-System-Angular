<section class="history" aria-labelledby="history-title">
  <h2 id="history-title">
    {{ staff ? "Reservation history" : "My reservations" }}
  </h2>
  <nav class="reservation-filters" aria-label="Reservation filters">
    @for (filter of filters; track filter.status) {
      <button
        appButton
        variant="secondary"
        type="button"
        [attr.aria-pressed]="selectedFilter === filter.status"
        (click)="selectedFilter = filter.status"
      >
        {{ filter.label }}
      </button>
    }
  </nav>
  <div class="reservation-cards">
    @for (
      detail of filteredReservations;
      track detail.reservation.reservationId
    ) {
      <app-reservation-card
        [detail]="detail"
        [staff]="staff"
        [guestName]="guestName || detail.reservation.clientName || 'Guest'"
      />
    } @empty {
      <p>
        No reservations found{{
          selectedFilter === "all" ? "." : " for this status."
        }}
      </p>
    }
  </div>
</section>
