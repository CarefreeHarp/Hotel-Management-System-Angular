<section aria-labelledby="photos-title">
  <h2 class="section-title" id="photos-title">
    {{ title || ('photos.title' | transloco) }}
  </h2>
  <p class="section-description">
    {{ description || ('photos.description' | transloco) }}
  </p>
  <app-form-field
    fieldId="mainPhoto"
    [label]="'photos.mainLabel' | transloco"
    type="url"
    [control]="mainPhoto"
    [maxlength]="500"
    placeholder="https://example.com/photo.jpg"
    [submitted]="submitted"
    [messages]="messages.main"
  />
  <div class="photo-fields">
    @for (photo of photos.controls; track photo; let i = $index) {
      <div class="photo-field">
        <span class="photo-field__number" aria-hidden="true">{{ i + 1 }}</span>
        <app-form-field
          [fieldId]="'photo-' + i"
          [label]="'photos.additionalLabel' | transloco: { number: i + 1 }"
          [hideLabel]="true"
          type="url"
          [control]="photo"
          [maxlength]="500"
          [required]="false"
          placeholder="https://example.com/additional-photo.jpg"
          [submitted]="submitted"
          [messages]="messages.additional"
        />
        <button
          class="remove-photo"
          type="button"
          (click)="photos.removeAt(i)"
          [attr.aria-label]="'photos.remove' | transloco: { number: i + 1 }"
        >
          ×
        </button>
      </div>
    }
  </div>
  <div class="add-photo">
    <button
      appButton
      variant="secondary"
      type="button"
      [disabled]="photos.length >= maxPhotos"
      (click)="addPhotoSubject.next()"
    >
      {{ 'photos.add' | transloco }}
    </button>
    <p class="photo-count" aria-live="polite">
      {{ 'photos.count' | transloco: { count: photos.length, max: maxPhotos } }}
    </p>
  </div>
</section>
