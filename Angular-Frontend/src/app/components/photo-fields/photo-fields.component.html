<section aria-labelledby="photos-title">
  <h2 class="section-title" id="photos-title">{{ title }}</h2>
  <p class="section-description">{{ description }}</p>
  <app-form-field
    fieldId="mainPhoto"
    label="Main photo URL"
    type="url"
    [control]="mainPhoto"
    [maxlength]="500"
    placeholder="https://example.com/photo.jpg"
    [submitted]="submitted"
    [messages]="messages.main"
  />
  <div class="photo-fields">
    @for (photo of photos.controls; track photo; let i = $index) {
      <div class="photo-field">
        <span class="photo-field__number" aria-hidden="true">{{ i + 1 }}</span>
        <app-form-field
          [fieldId]="'photo-' + i"
          [label]="'Additional photo ' + (i + 1) + ' URL'"
          [hideLabel]="true"
          type="url"
          [control]="photo"
          [maxlength]="500"
          [required]="false"
          placeholder="https://example.com/additional-photo.jpg"
          [submitted]="submitted"
          [messages]="messages.additional"
        />
        <button
          class="remove-photo"
          type="button"
          (click)="photos.removeAt(i)"
          [attr.aria-label]="'Remove additional photo ' + (i + 1)"
        >
          ×
        </button>
      </div>
    }
  </div>
  <div class="add-photo">
    <button
      appButton
      variant="secondary"
      type="button"
      [disabled]="photos.length >= maxPhotos"
      (click)="addPhoto.emit()"
    >
      ＋ Add another photo
    </button>
    <p class="photo-count" aria-live="polite">
      {{ photos.length }} of {{ maxPhotos }} additional photos
    </p>
  </div>
</section>
