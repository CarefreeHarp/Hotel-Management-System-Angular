<fieldset>
  <legend>{{ 'priceRange.legend' | transloco }}</legend>
  <div class="range-values" aria-live="polite">
    <output>{{ minimum | currency: "COP" : "symbol" : "1.0-2" }}</output
    ><span aria-hidden="true">—</span
    ><output>{{ maximum | currency: "COP" : "symbol" : "1.0-2" }}</output>
  </div>
  <div
    class="range-track"
    [style.--start]="start + '%'"
    [style.--end]="end + '%'"
  >
    <input
      #lower
      type="range"
      [attr.aria-label]="'priceRange.minimum' | transloco"
      [min]="floor"
      [disabled]="floor === limit"
      [max]="limit"
      step="0.01"
      [value]="minimum"
      [attr.aria-valuemax]="maximum"
      [style.z-index]="minimum === limit ? 3 : 1"
      (input)="changeMinimum(lower)"
    />
    <input
      #upper
      type="range"
      [attr.aria-label]="'priceRange.maximum' | transloco"
      [min]="floor"
      [disabled]="floor === limit"
      [max]="limit"
      step="0.01"
      [value]="maximum"
      [attr.aria-valuemin]="minimum"
      (input)="changeMaximum(upper)"
    />
  </div>
</fieldset>
