<dialog
  #drawer
  id="public-menu"
  class="menu-drawer"
  [class.is-closing]="isClosing"
  (transitionend)="finishClose($event)"
  (cancel)="$event.preventDefault(); close()"
  aria-labelledby="menu-title"
  (close)="resetState()"
  (click)="closeFromBackdrop($event)"
>
  <header class="menu-heading">
    <h2 id="menu-title">Menú</h2>
    <button
      type="button"
      class="close-menu"
      aria-label="Close menu"
      (click)="close()"
      autofocus
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22">
        <path d="m6 6 12 12M6 18 18 6" />
      </svg>
    </button>
  </header>
  <nav id="main-nav" class="header-navigation" aria-label="Main navigation">
    <ul class="main-nav">
      <li>
        <a routerLink="/" [queryParams]="authParams" (click)="close()">Home</a>
      </li>
      <li>
        <a
          routerLink="/"
          [queryParams]="authParams"
          fragment="video-section"
          (click)="close()"
          >The hotel</a
        >
      </li>
      <li>
        <a
          routerLink="/"
          [queryParams]="authParams"
          fragment="rooms-section"
          (click)="close()"
          >Suites</a
        >
      </li>
      <li>
        <a
          routerLink="/"
          [queryParams]="authParams"
          fragment="services-section"
          (click)="close()"
          >Services</a
        >
      </li>
      <li>
        <a
          routerLink="/services-catalog"
          [queryParams]="authParams"
          routerLinkActive="active"
          (click)="close()"
          >Service catalog</a
        >
      </li>
    </ul>
  </nav>
  <ng-content />
</dialog>
