<header
  class="site-header"
  [class.is-scrolled]="isSolidHeader"
  [class.is-hidden]="isHidden"
>
  <button
    class="nav-toggle"
    type="button"
    aria-haspopup="dialog"
    [attr.aria-expanded]="publicMenu.isOpen"
    aria-controls="public-menu"
    (click)="publicMenu.open()"
  >
    <span class="menu-bars" aria-hidden="true"
      ><span></span><span></span><span></span
    ></span>
    <span>Menú</span>
  </button>
  <a
    routerLink="/"
    [queryParams]="authParams"
    class="brand-mark"
    (click)="publicMenu.close()"
    ><img
      loading="eager"
      appImage
      imageWidth="480"
      src="/images/images-utils/hotel-identity/logo-transparent-639.webp"
      alt="Atlan Suites"
      class="brand-logo"
  /></a>
  @if (!compactHeader) {
    <div class="header-actions">
      <ng-container [ngTemplateOutlet]="accountActions" />
    </div>
  }
  <app-header-menu #publicMenu [authParams]="authParams">
    @if (compactHeader) {
      <div class="drawer-actions">
        <ng-container [ngTemplateOutlet]="accountActions" />
      </div>
    }
  </app-header-menu>
  <ng-template #accountActions>
    @if (authParams.auth) {
      @if (client$ | async; as client) {
        <a
          class="user-session-chip"
          routerLink="/profile"
          [queryParams]="authParams"
          (click)="publicMenu.close()"
          aria-label="My profile"
        >
          <span class="user-role-badge">Guest</span
          ><span class="user-name-text"
            >{{ client.name }} {{ client.lastName }}</span
          >
        </a>
      }
    } @else {
      <a routerLink="/login" class="glass-button" (click)="publicMenu.close()"
        >Login
      </a>
    }
    <a
      class="glass-button"
      routerLink="/book-now"
      [queryParams]="{ auth: authParams.auth, step: 'dates' }"
      (click)="publicMenu.close()"
      >Book now
    </a>
    @if (authParams.auth) {
      <button
        class="glass-button logout-btn"
        type="button"
        (click)="publicMenu.close(); logout()"
      >
        Log out
      </button>
    }
  </ng-template>
</header>
