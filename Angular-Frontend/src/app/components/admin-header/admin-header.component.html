<header class="admin-header">
  <button
    class="nav-toggle"
    type="button"
    aria-haspopup="dialog"
    [attr.aria-expanded]="menu.isOpen"
    aria-controls="site-menu"
    (click)="menu.open()"
  >
    <span class="menu-bars" aria-hidden="true"
      ><span></span><span></span><span></span
    ></span>
    <span>{{ 'header.menu' | transloco }}</span>
  </button>

  <a
    class="admin-brand"
    [routerLink]="base"
    [attr.aria-label]="
      (isOperator ? 'adminHeader.frontDesk' : 'adminHeader.adminPanel') | transloco
    "
  >
    <img
      loading="eager"
      appImage
      imageWidth="240"
      src="/images/images-utils/hotel-identity/logo-transparent-320.webp"
      alt="Atlan Suites"
    />
  </a>

  @if (showSectionsBar) {
    <nav class="admin-nav" [attr.aria-label]="'adminHeader.navigation' | transloco">
      @for (link of menuLinks; track link.labelKey) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
          >{{ link.labelKey | transloco }}</a
        >
      }
    </nav>
  }
  @if (!compactHeader) {
    <div class="admin-actions">
      <ng-container [ngTemplateOutlet]="accountActions" />
    </div>
  }

  <app-header-menu #menu [links]="menuLinks">
    @if (compactHeader) {
      <div class="drawer-actions">
        <ng-container [ngTemplateOutlet]="accountActions" />
      </div>
    }
  </app-header-menu>

  <ng-template #accountActions>
    <a
      class="admin-link"
      [routerLink]="isOperator ? [base, 'profile'] : [base, 'administrators', adminId]"
      (click)="menu.close()"
      ><svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        width="17"
        height="17"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
      >
        <circle cx="12" cy="8" r="4" />
        <path d="M4 22v-3a8 8 0 0 1 16 0v3" /></svg
      >{{ 'adminHeader.myProfile' | transloco }}</a
    >
    <button
      class="admin-link admin-logout"
      type="button"
      (click)="menu.close(); logout()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        width="17"
        height="17"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
      >
        <path d="M9 4H4v16h5M14 7l5 5-5 5M8 12h11" /></svg
      >{{ 'adminHeader.logout' | transloco }}
    </button>
    <a class="admin-exit" routerLink="/" (click)="menu.close()">{{ 'adminHeader.goToHotel' | transloco }}</a>
  </ng-template>
</header>
