<section class="gallery-section" aria-labelledby="additional-photos-title">
  <p class="card-eyebrow">{{ 'gallery.eyebrow' | transloco }}</p>
  <h2 class="gallery-title" id="additional-photos-title">
    {{ 'gallery.title' | transloco }}
  </h2>
  <ul class="gallery-grid">
    @for (photo of photos; track $index) {
      <li>
        <img
          appImage
          imageWidth="1280"
          [src]="photo"
          [alt]="'gallery.photoAlt' | transloco: { name: name, number: $index + 1 }"
          loading="lazy"
        />
      </li>
    }
  </ul>
</section>
