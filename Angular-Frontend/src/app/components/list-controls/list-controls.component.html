<section
  class="list-controls"
  [attr.aria-label]="'list.controls' | transloco"
>
  <form (submit)="$event.preventDefault()">
    <label class="search-field"
      >{{ 'list.search' | transloco }}<input
        type="search"
        name="search"
        [ngModel]="state.search"
        (ngModelChange)="update({ search: $event })"
        [placeholder]="'list.searchPlaceholder' | transloco"
    /></label>
    @for (item of filters; track item.key) {
      <label
        >{{ item.labelKey | transloco }}
        @if (item.type) {
          <input
            [type]="item.type"
            [attr.min]="item.type === 'number' ? 0 : null"
            [name]="item.key"
            [ngModel]="state.filters[item.key] ?? ''"
            (ngModelChange)="filter(item.key, $event)"
          />
        } @else {
          <select
            [name]="item.key"
            [ngModel]="state.filters[item.key] ?? ''"
            (ngModelChange)="filter(item.key, $event)"
          >
            <option value="">{{ 'list.all' | transloco }}</option>
            @for (option of item.options; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        }
      </label>
    }
    @if (priceLimit > 0) {
      <app-price-range
        [floor]="priceFloor"
        [limit]="priceLimit"
        [minimum]="minimumPrice"
        [maximum]="maximumPrice"
        (changed)="prices($event)"
      />
    }
    <label
      >{{ 'list.orderBy' | transloco }}<select
        name="sort"
        [ngModel]="state.sort"
        (ngModelChange)="update({ sort: $event })"
      >
        @for (option of sortOptions; track option.value) {
          <option [value]="option.value">
            {{ option.labelKey | transloco }}
          </option>
        }
      </select></label
    ><button type="button" (click)="reset()">{{ 'list.clear' | transloco }}</button>
  </form>
  <footer>
    <p role="status">
      {{ 'list.results' | transloco: { count: count, total: total } }}
    </p>
    <nav [attr.aria-label]="'list.displayMode' | transloco">
      <button
        type="button"
        [attr.aria-label]="'list.tableView' | transloco"
        [title]="'list.tableView' | transloco"
        [attr.aria-pressed]="state.view === 'table'"
        (click)="update({ view: 'table' })"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M3 9h18M3 14h18M9 4v16" />
        </svg></button
      ><button
        type="button"
        [attr.aria-label]="'list.gridView' | transloco"
        [title]="'list.gridView' | transloco"
        [attr.aria-pressed]="state.view === 'cards'"
        (click)="update({ view: 'cards' })"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
      </button>
    </nav>
  </footer>
</section>
