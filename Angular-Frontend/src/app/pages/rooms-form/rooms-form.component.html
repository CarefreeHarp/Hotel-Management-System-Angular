<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (error) {
      <p class="form-alert" role="alert">{{ error }}</p>
    }
    @if (loading) {
      <p role="status">Loading room information...</p>
    } @else {
      <app-page-heading
        eyebrow="Room catalog"
        [title]="isCreateMode ? 'Create room' : 'Edit room'"
        description="Define the room number, floor, status and room type."
      >
        <a appButton variant="secondary" [routerLink]="[base, 'rooms']">Back to list</a>
      </app-page-heading>
      <form class="form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
        @if (submitted && form.invalid) {
          <p class="form-alert" role="alert">
            Please check the highlighted fields before saving.
          </p>
        }
        @if (!roomTypes.length) {
          <p class="form-alert" role="alert">
            A room type must exist before a room can be saved.
          </p>
          <a appButton variant="secondary" [routerLink]="[base, 'room-types', 'new']"
            >Create room type</a
          >
        }
        <app-room-fields
          class="form-section"
          [form]="form"
          [roomTypes]="roomTypes"
          [submitted]="submitted"
        />
        <div class="form-actions">
          <button
            appButton
            type="submit"
            [disabled]="saving || !roomTypes.length"
          >
            {{
              saving ? "Saving..." : isCreateMode ? "Create room" : "Save room"
            }}
          </button>
          <a
            appButton
            variant="secondary"
            [routerLink]="isCreateMode ? [base, 'rooms'] : [base, 'rooms', item?.roomId]"
            >Cancel</a
          >
        </div>
      </form>
    }
  </div>
</main>
