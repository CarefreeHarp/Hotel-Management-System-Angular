<section class="gallery-section" aria-labelledby="service-gallery-title">
  <header class="gallery-heading">
    <div>
      <p class="eyebrow">{{ 'catalog.gallery.eyebrow' | transloco }}</p>
      <h2 id="service-gallery-title">{{ 'catalog.gallery.title' | transloco }}</h2>
    </div>
    <p>{{ 'catalog.gallery.description' | transloco: { name: name } }}</p>
  </header>
  <ul class="gallery-grid">
    @for (photo of images; track $index) {
      <li class="gallery-card">
        <button
          type="button"
          (click)="open(photo)"
          [attr.aria-label]="'catalog.gallery.enlarge' | transloco: { name: name, number: $index + 1 }"
        >
          <figure>
            <img
              appImage
              imageWidth="1280"
              [src]="photo"
              [alt]="
                $index === 0
                  ? ('catalog.gallery.mainAlt' | transloco: { name: name })
                  : ('catalog.gallery.imageAlt' | transloco: { name: name, number: $index })
              "
              loading="lazy"
            />
            <figcaption>{{ name }}</figcaption>
          </figure>
        </button>
      </li>
    }
  </ul>
</section>
<dialog
  #lightbox
  class="gallery-lightbox"
  [attr.aria-label]="'catalog.gallery.preview' | transloco: { name: name }"
  (click)="backdrop($event)"
>
  <button
    type="button"
    class="lightbox-close"
    [attr.aria-label]="'catalog.gallery.closePreview' | transloco"
    (click)="close()"
  >
    ×
  </button>
  @if (selectedPhoto) {
    <img
      appImage
      imageWidth="1280"
      [src]="selectedPhoto"
      [alt]="name"
      class="lightbox-image"
    />
  }
</dialog>
