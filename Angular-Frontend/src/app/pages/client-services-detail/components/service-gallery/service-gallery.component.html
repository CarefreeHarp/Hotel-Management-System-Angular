<section class="gallery-section" aria-labelledby="service-gallery-title">
  <header class="gallery-heading">
    <div>
      <p class="eyebrow">Visual tour</p>
      <h2 id="service-gallery-title">Service gallery</h2>
    </div>
    <p>Images associated with {{ name }}.</p>
  </header>
  <ul class="gallery-grid">
    @for (photo of images; track $index) {
      <li class="gallery-card">
        <button
          type="button"
          (click)="open(photo)"
          [attr.aria-label]="'Enlarge ' + name + ' image ' + ($index + 1)"
        >
          <figure>
            <img
              appImage
              imageWidth="1280"
              [src]="photo"
              [alt]="
                name +
                ($index === 0 ? ' — main image' : ' — gallery image ' + $index)
              "
              loading="lazy"
            />
            <figcaption>{{ name }}</figcaption>
          </figure>
        </button>
      </li>
    }
  </ul>
</section>
<dialog
  #lightbox
  class="gallery-lightbox"
  [attr.aria-label]="name + ' image preview'"
  (click)="backdrop($event)"
>
  <button
    type="button"
    class="lightbox-close"
    aria-label="Close image preview"
    (click)="close()"
  >
    ×
  </button>
  @if (selectedPhoto) {
    <img
      appImage
      imageWidth="1280"
      [src]="selectedPhoto"
      [alt]="name"
      class="lightbox-image"
    />
  }
</dialog>
