<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (isLoading) {
      <app-skeleton variant="form" [label]="'common.loadingForm' | transloco" />
    } @else {
      <app-page-heading
        [eyebrow]="'common.staffManagement' | transloco"
        [title]="(isCreateMode ? 'operators.form.createTitle' : 'operators.form.editTitle') | transloco"
        [description]="
          (isCreateMode
            ? 'operators.form.createDescription'
            : 'account.editDescription'
          ) | transloco
        "
        ><a appButton variant="secondary" [routerLink]="[base, 'operators']"
          >{{ 'common.actions.backToList' | transloco }}</a
        ></app-page-heading
      >
      <form class="form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
        <app-operator-fields
          class="form-section"
          [form]="form"
          [administrators]="administrators"
          [submitted]="submitted"
          [isCreateMode]="isCreateMode"
        />
        <div class="form-actions">
          <button appButton type="submit" [disabled]="isSaving">
            {{
              (isSaving
                ? 'common.saving'
                : isCreateMode
                  ? 'operators.form.create'
                  : 'operators.form.save'
              ) | transloco
            }}</button
          ><a
            appButton
            variant="secondary"
            [routerLink]="
              isCreateMode ? [base, 'operators'] : [base, 'operators', item?.operatorId]
            "
            >{{ 'common.actions.cancel' | transloco }}</a
          >
        </div>
        @if (submitted && form.invalid) {
          <p class="form-alert" role="alert">
            {{ 'common.checkFields' | transloco }}
          </p>
        }
        @if (saveError) {
          <p class="form-alert" role="alert">{{ saveError }}</p>
        }
      </form>
    }
  </div>
</main>
