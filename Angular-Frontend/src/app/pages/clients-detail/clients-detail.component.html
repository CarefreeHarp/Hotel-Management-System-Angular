<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (isLoading) {
      <app-skeleton variant="detail" label="Loading client…" />
    } @else if (client) {
      <app-page-heading
        eyebrow="Client management"
        [title]="client.name + ' ' + client.lastName"
        description="Client profile and contact information."
      >
        <a appButton [routerLink]="[base, 'clients', client.clientId, 'edit']"
          >Edit client</a
        >
      </app-page-heading>
      @if (saved) {
        <p class="saved-alert" role="status">Client saved successfully.</p>
      }
      <app-client-info [client]="client" [staff]="true" />
      @if (historyLoading) {
        <app-skeleton variant="cards" label="Loading reservations…" />
      } @else if (historyError) {
        <p role="alert">{{ historyError }}</p>
      } @else {
        <app-reservation-history
          [reservations]="reservations"
          [staff]="true"
          [guestName]="client.name + ' ' + client.lastName"
        />
      }
    }
  </div>
</main>
