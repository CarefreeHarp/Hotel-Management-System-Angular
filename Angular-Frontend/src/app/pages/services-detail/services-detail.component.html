<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (state$ | async; as state) {
      @if (state.loading) {
        <app-skeleton variant="detail" [label]="'services.detail.loading' | transloco" />
      } @else {
        @if (state.service; as service) {
          <app-page-heading
            [eyebrow]="service.category"
            [title]="service.name"
            [description]="service.summary || ''"
            ><a
              appButton
              [routerLink]="[base, 'services', service.serviceId, 'edit']"
              >{{ 'services.detail.edit' | transloco }}</a
            ></app-page-heading
          >
          @if (saved$ | async) {
            <p class="saved-alert" role="status">{{ 'services.detail.saved' | transloco }}</p>
          }
          <app-service-info [service]="service" />
          @if (service.secondaryImageUrls.length) {
            <app-gallery
              [name]="service.name"
              [photos]="service.secondaryImageUrls"
            />
          }
        }
      }
    }
  </div>
</main>
