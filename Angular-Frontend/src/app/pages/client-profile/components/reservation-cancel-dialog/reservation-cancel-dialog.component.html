<dialog
  #dialog
  aria-labelledby="cancel-reservation-title"
  aria-describedby="cancel-reservation-description"
  [attr.aria-busy]="busy"
  (cancel)="dismiss($event)"
>
  <header>
    <p class="eyebrow">{{ 'reservationHistory.clientTitle' | transloco }}</p>
    <h2 id="cancel-reservation-title">{{ 'profile.cancel.title' | transloco: { code: reservationCode } }}</h2>
  </header>
  <p id="cancel-reservation-description">
    {{ 'profile.cancel.description' | transloco }}
  </p>
  <form (ngSubmit)="confirmCancellation()">
    <label for="cancellation-confirmation">{{ 'profile.cancel.typeBefore' | transloco }} <strong class="confirmation-phrase">&quot;{{ confirmationPhrase }}&quot;</strong> {{ 'profile.cancel.typeAfter' | transloco }}</label>
    <input
      id="cancellation-confirmation"
      name="confirmation"
      type="text"
      autocomplete="off"
      spellcheck="false"
      [(ngModel)]="confirmationText"
      [disabled]="busy"
    />
    @if (errorMessage) {
      <p class="warning" role="alert">{{ errorMessage }}</p>
    }
    <footer>
      <button appButton type="button" variant="secondary" autofocus [disabled]="busy" (click)="dismiss()">{{ 'profile.cancel.keep' | transloco }}</button>
      <button appButton type="submit" variant="danger" [disabled]="busy || confirmationText !== confirmationPhrase">{{ (busy ? 'profile.cancel.cancelling' : 'common.actions.cancel') | transloco }}</button>
    </footer>
  </form>
</dialog>
