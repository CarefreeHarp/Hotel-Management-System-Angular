<app-header [solid]="true" />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (isLoading) {
      <p role="status">Loading your profile…</p>
    } @else if (client) {
      <app-page-heading
        eyebrow="My profile"
        [title]="client.name + ' ' + client.lastName"
        description="Your account details and reservations at Atlan Suites."
        ><a appButton routerLink="/profile/edit" [queryParams]="authParams"
          >Edit profile</a
        ></app-page-heading
      >
      @if (saved) {
        <p class="saved-alert" role="status">Profile saved successfully.</p>
      }
      <app-client-info [client]="client" />
      @if (errorMessage) {
        <p class="form-alert" role="alert">{{ errorMessage }}</p>
      }
      <app-reservation-history
        [reservations]="reservations"
        [guestName]="client.name + ' ' + client.lastName"
      />
      <footer class="detail-actions">
        <button
          appButton
          variant="secondary"
          type="button"
          [disabled]="isDeleting"
          (click)="deleteAccount()"
        >
          {{ isDeleting ? "Deleting…" : "Delete account" }}
        </button>
      </footer>
    } @else {
      <app-page-heading
        eyebrow="My profile"
        title="Profile unavailable"
        [description]="loadError"
        ><a appButton routerLink="/login">Sign in</a></app-page-heading
      >
    }
  </div>
</main>
