<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (isLoading) {
      <app-skeleton variant="detail" label="Loading operator…" />
    } @else {
      @if (item; as operator) {
        <app-page-heading
          eyebrow="Operator profile"
          [title]="operator.name + ' ' + operator.lastName"
          description="Account details and reporting line registered in the portal."
        >
          @if (!isOperatorProfile) {
            <a
              appButton
              [routerLink]="[base, 'operators', operator.operatorId, 'edit']"
              >Edit operator</a
            >
          }
        </app-page-heading>
        @if (saved) {
          <p class="saved-alert" role="status">Operator saved successfully.</p>
        }
        <app-operator-info [operator]="operator" />
      }
    }
  </div>
</main>
