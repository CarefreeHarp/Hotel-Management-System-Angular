<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (state$ | async; as state) {
      @if (state.loading) {
        <app-skeleton variant="detail" [label]="'rooms.detail.loading' | transloco" />
      } @else {
        @if (state.room; as room) {
          <app-page-heading
            [eyebrow]="'rooms.detail.eyebrow' | transloco"
            [title]="'rooms.roomNumber' | transloco: { number: room.number }"
            [description]="room.roomType.name"
          >
            <a appButton [routerLink]="[base, 'rooms', room.roomId, 'edit']"
              >{{ 'rooms.detail.edit' | transloco }}</a
            >
          </app-page-heading>
          @if (saved$ | async) {
            <p class="saved-alert" role="status">{{ 'rooms.detail.saved' | transloco }}</p>
          }
          <app-room-info [room]="room" />
          @if (room.roomType.secondaryPhotos.length) {
            <app-gallery
              [name]="'rooms.roomNumber' | transloco: { number: room.number }"
              [photos]="room.roomType.secondaryPhotos"
            />
          }
        }
      }
    }
  </div>
</main>
