<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (loading) { <app-skeleton variant="form" [label]="'services.form.loading' | transloco" /> } @else {
      <app-page-heading
        [eyebrow]="'services.form.eyebrow' | transloco"
        [title]="(isCreateMode ? 'services.form.createTitle' : 'services.form.editTitle') | transloco"
        [description]="'services.form.description' | transloco"
        ><a appButton variant="secondary" [routerLink]="[base, 'services']"
          >{{ 'common.actions.backToList' | transloco }}</a
        ></app-page-heading
      >
      <form class="form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
        <app-service-fields
          class="form-section"
          [form]="form"
          [submitted]="submitted"
        />
        <app-photo-fields
          class="form-section"
          [title]="'services.form.photos' | transloco"
          [mainPhoto]="form.controls.mainImageUrl"
          [photos]="form.controls.secondaryImageUrls"
          [submitted]="submitted"
          (addPhoto)="addPhoto()"
        />
        <div class="form-actions">
          <button appButton type="submit" [disabled]="saving">
            {{
              (saving
                ? 'common.saving'
                : isCreateMode
                  ? 'services.form.create'
                  : 'services.form.save'
              ) | transloco
            }}</button
          ><a
            appButton
            variant="secondary"
            [routerLink]="
              isCreateMode ? [base, 'services'] : [base, 'services', item?.serviceId]
            "
            >{{ 'common.actions.cancel' | transloco }}</a
          >
        </div>
        @if (error) { <p class="form-alert" role="alert">{{ error }}</p> }
        @if (submitted && form.invalid) {
          <p class="form-alert" role="alert">
            {{ 'common.checkFields' | transloco }}
          </p>
        }
      </form>
    }
  </div>
</main>
