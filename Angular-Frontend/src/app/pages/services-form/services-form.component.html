<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (error) { <p class="form-alert" role="alert">{{ error }}</p> }
    @if (loading) { <app-skeleton variant="form" label="Loading service..." /> } @else {
      <app-page-heading
        eyebrow="Service catalog"
        [title]="isCreateMode ? 'Create service' : 'Edit service'"
        description="Define the service information, price and photos."
        ><a appButton variant="secondary" [routerLink]="[base, 'services']"
          >Back to list</a
        ></app-page-heading
      >
      <form class="form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
        @if (submitted && form.invalid) {
          <p class="form-alert" role="alert">
            Please check the highlighted fields before saving.
          </p>
        }
        <app-service-fields
          class="form-section"
          [form]="form"
          [submitted]="submitted"
        />
        <app-photo-fields
          class="form-section"
          title="Service photos"
          [mainPhoto]="form.controls.mainImageUrl"
          [photos]="form.controls.secondaryImageUrls"
          [submitted]="submitted"
          (addPhoto)="addPhoto()"
        />
        <div class="form-actions">
          <button appButton type="submit" [disabled]="saving">
            {{ saving ? "Saving..." : isCreateMode ? "Create service" : "Save service" }}</button
          ><a
            appButton
            variant="secondary"
            [routerLink]="
              isCreateMode ? [base, 'services'] : [base, 'services', item?.serviceId]
            "
            >Cancel</a
          >
        </div>
      </form>
    }
  </div>
</main>
