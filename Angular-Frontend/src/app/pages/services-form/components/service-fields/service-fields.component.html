@if (form; as form) {
  <section [formGroup]="form" aria-labelledby="information-title">
    <h2 id="information-title">{{ 'services.detail.information' | transloco }}</h2>
    <p class="section-description">
      {{ 'services.form.requiredFields' | transloco }}
    </p>
    <div class="form-grid">
      <app-form-field
        fieldId="activationStatus"
        [label]="'common.fields.activation' | transloco"
        [control]="form.controls.activationStatus"
        [options]="activationOptions"
      />
      @for (field of textFields; track field.key) {
        <app-form-field
          [fieldId]="field.key"
          [label]="field.labelKey | transloco"
          [control]="form.controls[field.key]"
          [required]="field.required"
          [maxlength]="field.max"
          [submitted]="submitted"
          [messages]="messages[field.key]"
        />
      }
      <app-form-field
        fieldId="price"
        [label]="'services.fields.priceCop' | transloco"
        type="number"
        prefix="$"
        [control]="form.controls.price"
        [min]="0"
        [max]="99999999.99"
        [step]="0.01"
        [hint]="'services.form.priceHint' | transloco"
        [submitted]="submitted"
        [messages]="messages.price"
      />
      <app-form-field
        class="full-width"
        fieldId="description"
        [label]="'services.fields.description' | transloco"
        [multiline]="true"
        [rows]="6"
        [control]="form.controls.description"
        [maxlength]="5000"
        [hint]="'services.form.descriptionHint' | transloco"
        [submitted]="submitted"
        [messages]="messages.description"
      />
    </div>
  </section>
}
