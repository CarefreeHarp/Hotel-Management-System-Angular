@if (form; as form) {
  <section [formGroup]="form" aria-labelledby="information-title">
    <h2 id="information-title">Service information</h2>
    <p class="section-description">
      Required fields: name, category, description, price and main image.
    </p>
    <div class="form-grid">
      <app-form-field
        fieldId="activationStatus"
        label="Activation"
        [control]="form.controls.activationStatus"
        [options]="activationOptions"
      />
      @for (field of textFields; track field.key) {
        <app-form-field
          [fieldId]="field.key"
          [label]="field.label"
          [control]="form.controls[field.key]"
          [required]="field.required"
          [maxlength]="field.max"
          [submitted]="submitted"
          [messages]="messages[field.key]"
        />
      }
      <app-form-field
        fieldId="price"
        label="Price (COP)"
        type="number"
        prefix="$"
        [control]="form.controls.price"
        [min]="0"
        [max]="99999999.99"
        [step]="0.01"
        hint="From 0 to 99,999,999.99, up to two decimals."
        [submitted]="submitted"
        [messages]="messages.price"
      />
      <app-form-field
        class="full-width"
        fieldId="description"
        label="Description"
        [multiline]="true"
        [rows]="6"
        [control]="form.controls.description"
        [maxlength]="5000"
        hint="Maximum 5,000 characters."
        [submitted]="submitted"
        [messages]="messages.description"
      />
    </div>
  </section>
}
