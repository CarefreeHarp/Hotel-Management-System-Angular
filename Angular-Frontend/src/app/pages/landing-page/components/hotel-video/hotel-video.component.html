<section class="video-section" id="video-section" aria-labelledby="hotel-title">
  <h2 class="sr-only" id="hotel-title">{{ 'landing.video.eyebrow' | transloco }}</h2>
  <video
    #hotelVideo
    class="scroll-video"
    muted
    playsinline
    preload="metadata"
    [attr.aria-label]="'landing.video.label' | transloco"
  >
    <source src="images/landing-page/Hotel_video.mp4" type="video/mp4" />
  </video>
  <aside class="video-view-card">
    <span class="eyebrow">{{ 'landing.video.eyebrow' | transloco }}</span>
    <h3>{{ 'landing.video.title' | transloco }}</h3>
  </aside>
</section>
