<section class="hero" id="hero" aria-labelledby="hero-title">
  <img
    loading="eager"
    appImage
    imageWidth="1600"
    src="/images/landing-page/hero_lobby-1600.webp"
    [alt]="'landing.hero.imageAlt' | transloco: { hotel: hotelName }"
    class="hero-image"
  />
  <div class="hero-veil" aria-hidden="true"></div>

  <h1 class="hero-title" id="hero-title">{{ hotelName }}</h1>

  <aside
    class="hero-card fade-in"
    [attr.aria-label]="'landing.hero.cardLabel' | transloco: { hotel: hotelName }"
  >
    <p class="eyebrow">{{ 'landing.hero.eyebrow' | transloco }}</p>
    <p class="hero-card-headline">
      {{ 'landing.hero.headlineStart' | transloco }}<br />{{ 'landing.hero.headlineEnd' | transloco }}
    </p>
    <button type="button" class="btn btn-gold" (click)="scrollToHotel()">
      {{ 'landing.hero.explore' | transloco }}
    </button>
  </aside>

  <p class="hero-meta">
    <span>{{ 'app.city' | transloco }}</span>
  </p>
</section>
