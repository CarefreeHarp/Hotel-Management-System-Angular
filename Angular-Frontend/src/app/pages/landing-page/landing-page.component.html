<div
  class="scroll-progress"
  role="progressbar"
  [attr.aria-label]="'landing.scrollProgress' | transloco"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="scrollProgress.toFixed(0)"
  [style.width.%]="scrollProgress"
></div>
<app-header [isHidden]="isHeaderHidden" />
<main id="main-content">
  <app-hero />
  <app-hotel-video (fullscreenChange)="isHeaderHidden = $event" />
  <app-suites />
  <app-landing-services />
</main>
<app-footer />
