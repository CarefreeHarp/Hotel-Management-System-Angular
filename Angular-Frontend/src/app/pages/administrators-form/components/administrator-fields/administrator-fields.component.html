@if (form; as form) {
  <section class="fields-group" aria-labelledby="account-title">
    <h2 id="account-title">{{ 'account.information' | transloco }}</h2>
    <p class="section-description">
      {{ 'account.staffEmailUnique' | transloco }}
    </p>
    <div class="form-grid">
      <app-form-field
        fieldId="name"
        [label]="'common.fields.name' | transloco"
        [placeholder]="'administrators.form.namePlaceholder' | transloco"
        [hint]="'common.upToChars' | transloco: { max: 60 }"
        [control]="form.controls.name"
        [maxlength]="60"
        [submitted]="submitted"
        [messages]="messages.name"
      />
      <app-form-field
        fieldId="email"
        [label]="'common.fields.emailAddress' | transloco"
        type="email"
        placeholder="name@atlansuites.com"
        [hint]="'account.staffEmailHint' | transloco"
        [control]="form.controls.email"
        [maxlength]="100"
        [submitted]="submitted"
        [messages]="messages.email"
      />
    </div>
  </section>
  @if (isCreateMode) {
    <section class="fields-group" aria-labelledby="password-title">
      <h2 id="password-title">{{ 'account.passwordTitle' | transloco }}</h2>
      <p class="section-description">
        {{ 'account.passwordSetOnCreate' | transloco }}
      </p>
      <div class="form-grid">
        <app-form-field
          fieldId="password"
          [label]="'account.newPassword' | transloco"
          type="password"
          [hint]="'account.passwordHint' | transloco"
          [error]="'validation.password.invalid' | transloco"
          [control]="form.controls.password"
          [maxlength]="255"
          [submitted]="submitted"
        />
      </div>
    </section>
  }
}
