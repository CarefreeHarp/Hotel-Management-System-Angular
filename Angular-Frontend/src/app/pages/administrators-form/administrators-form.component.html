<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (isLoading) {
      <app-skeleton variant="form" label="Loading form…" />
    } @else {
      <app-page-heading
        eyebrow="Staff management"
        [title]="isCreateMode ? 'Create administrator' : 'Edit administrator'"
        [description]="
          isCreateMode
            ? 'Enter the details of the new administrator account.'
            : 'Update the account details. The current password is kept.'
        "
        ><a appButton variant="secondary" [routerLink]="[base, 'administrators']"
          >Back to list</a
        ></app-page-heading
      >
      <form class="form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
        @if (submitted && form.invalid) {
          <p class="form-alert" role="alert">
            Please check the highlighted fields before saving.
          </p>
        }
        @if (saveError) {
          <p class="form-alert" role="alert">{{ saveError }}</p>
        }
        <app-administrator-fields
          class="form-section"
          [form]="form"
          [submitted]="submitted"
          [isCreateMode]="isCreateMode"
        />
        <div class="form-actions">
          <button appButton type="submit" [disabled]="isSaving">
            {{
              isSaving
                ? "Saving…"
                : isCreateMode
                  ? "Create administrator"
                  : "Save administrator"
            }}</button
          ><a
            appButton
            variant="secondary"
            [routerLink]="
              isCreateMode
                ? [base, 'administrators']
                : [base, 'administrators', item?.adminId]
            "
            >Cancel</a
          >
        </div>
      </form>
    }
  </div>
</main>
