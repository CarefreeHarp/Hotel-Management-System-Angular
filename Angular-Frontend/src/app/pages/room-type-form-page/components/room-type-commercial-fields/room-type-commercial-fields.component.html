@if (form; as form) {
  <section aria-labelledby="type-data-title">
    <h2 class="section-title" id="type-data-title">{{ 'roomTypes.detail.commercial' | transloco }}</h2>
    <p class="section-description">
      {{ 'roomTypes.form.commercialDescription' | transloco }}
    </p>
    <div class="form-grid">
      <app-form-field
        fieldId="name"
        [label]="'roomTypes.fields.name' | transloco"
        [control]="form.controls.name"
        [maxlength]="50"
        [submitted]="submitted"
        [messages]="messages.name"
      />
      <app-form-field
        fieldId="maxCapacity"
        [label]="'roomTypes.fields.maxCapacity' | transloco"
        type="number"
        [control]="form.controls.maxCapacity"
        [min]="1"
        [max]="10"
        [step]="1"
        [hint]="'roomTypes.form.capacityHint' | transloco"
        [submitted]="submitted"
        [messages]="messages.maxCapacity"
      />
      <app-form-field
        class="full-width"
        fieldId="description"
        [label]="'roomTypes.fields.description' | transloco"
        [multiline]="true"
        [control]="form.controls.description"
        [maxlength]="500"
        [hint]="'roomTypes.form.descriptionHint' | transloco"
        [submitted]="submitted"
        [messages]="messages.description"
      />
      <app-form-field
        fieldId="nightlyPrice"
        [label]="'roomTypes.fields.pricePerNightCop' | transloco"
        type="number"
        prefix="$"
        [control]="form.controls.nightlyPrice"
        [min]="0.01"
        [max]="99999999.99"
        [step]="0.01"
        [hint]="'roomTypes.form.priceHint' | transloco"
        [submitted]="submitted"
        [messages]="messages.nightlyPrice"
      />
    </div>
  </section>
}
