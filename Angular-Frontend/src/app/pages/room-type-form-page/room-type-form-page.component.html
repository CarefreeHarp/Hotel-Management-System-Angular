<app-admin-header />

<main class="catalog-page">
  <div class="catalog-page__container">
    @if (loading) {
      <app-skeleton variant="form" [label]="'roomTypes.detail.loading' | transloco" />
    } @else {
      <app-page-heading
        [title]="(isCreateMode ? 'roomTypes.form.createTitle' : 'roomTypes.form.editTitle') | transloco"
        [description]="
          isCreateMode
            ? ('roomTypes.form.createDescription' | transloco)
            : ('roomTypes.form.editDescription' | transloco: { name: roomType?.name })
        "
      />
      <form class="form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
        <app-room-type-commercial-fields
          class="form-section"
          [form]="form"
          [submitted]="submitted"
        />
        <app-photo-fields
          class="form-section"
          [mainPhoto]="form.controls.mainPhoto"
          [photos]="form.controls.secondaryPhotos"
          [description]="'roomTypes.form.photosDescription' | transloco"
          [submitted]="submitted"
          (addPhoto)="addPhoto()"
        />
        <div class="form-actions">
          <button appButton type="submit" [disabled]="saving">
            {{
              (saving
                ? 'common.saving'
                : isCreateMode
                  ? 'roomTypes.form.create'
                  : 'roomTypes.form.save'
              ) | transloco
            }}
            <span aria-hidden="true">→</span>
          </button>
          <a
            appButton
            variant="secondary"
            [routerLink]="
              isCreateMode
                ? [base, 'room-types']
                : [base, 'room-types', roomType?.roomTypeId]
            "
            >{{ 'common.actions.cancel' | transloco }}</a
          >
        </div>
        @if (submitted && form.invalid) {
          <p class="form-alert" role="alert">
            {{ 'common.checkFields' | transloco }}
          </p>
        }
        @if (error) {
          <p class="form-alert" role="alert">{{ error }}</p>
        }
      </form>
    }
  </div>
</main>
