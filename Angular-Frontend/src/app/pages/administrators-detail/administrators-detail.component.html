<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (isLoading) {
      <app-skeleton variant="detail" [label]="'administrators.detail.loading' | transloco" />
    } @else {
      @if (item; as administrator) {
        <app-page-heading
          [eyebrow]="'administrators.detail.eyebrow' | transloco"
          [title]="administrator.name"
          [description]="'administrators.detail.description' | transloco"
          ><a
            appButton
            [routerLink]="[base, 'administrators', administrator.adminId, 'edit']"
            >{{ 'administrators.detail.edit' | transloco }}</a
          ></app-page-heading
        >
        @if (saved) {
          <p class="saved-alert" role="status">
            {{ 'administrators.detail.saved' | transloco }}
          </p>
        }
        <app-administrator-info
          [administrator]="administrator"
          [operatorCount]="operators.length"
        />
        <app-assigned-operators
          [adminId]="administrator.adminId"
          [operators]="operators"
        />
      }
    }
  </div>
</main>
