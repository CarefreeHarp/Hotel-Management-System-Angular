<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (isLoading) {
      <p class="loading-state" role="status">Loading administrator…</p>
    } @else {
      @if (item; as administrator) {
        <app-page-heading
          eyebrow="Administrator profile"
          [title]="administrator.name"
          description="Account details registered in the administration portal."
          ><a
            appButton
            [routerLink]="[base, 'administrators', administrator.adminId, 'edit']"
            >Edit administrator</a
          ></app-page-heading
        >
        @if (saved) {
          <p class="saved-alert" role="status">
            Administrator saved successfully.
          </p>
        }
        <app-administrator-info
          [administrator]="administrator"
          [operatorCount]="operators.length"
        />
        <app-assigned-operators
          [adminId]="administrator.adminId"
          [operators]="operators"
        />
      } @else {
        <app-page-heading
          eyebrow="Staff management"
          title="Administrator not found"
          description="This administrator does not exist or could not be loaded. Make sure the Spring Boot backend is running."
          ><a appButton [routerLink]="[base, 'administrators']"
            >Back to list</a
          ></app-page-heading
        >
      }
    }
  </div>
</main>
