@if (form; as form) {
  <section class="fields-group" aria-labelledby="profile-title">
    <h2 id="profile-title">{{ 'clientInfo.label' | transloco }}</h2>
    <p class="section-description">
      {{ 'clients.form.fieldsDescription' | transloco }}
    </p>
    <div class="form-grid">
      <app-form-field
        fieldId="name"
        [label]="'common.fields.firstName' | transloco"
        type="text"
        [control]="form.controls.name"
        [maxlength]="60"
        [submitted]="submitted"
        [messages]="messages.name"
      />
      <app-form-field
        fieldId="lastName"
        [label]="'common.fields.lastName' | transloco"
        type="text"
        [control]="form.controls.lastName"
        [maxlength]="60"
        [submitted]="submitted"
        [messages]="messages.lastName"
      />
      <app-form-field
        fieldId="nationalId"
        [label]="'common.fields.nationalId' | transloco"
        type="text"
        [control]="form.controls.nationalId"
        [maxlength]="20"
        [submitted]="submitted"
        [hint]="'clients.form.nationalIdHint' | transloco"
        [messages]="messages.nationalId"
      />
      <app-form-field
        fieldId="phone"
        [label]="'common.fields.phone' | transloco"
        type="tel"
        [control]="form.controls.phone"
        restrict="phone"
        inputmode="tel"
        [maxlength]="16"
        [submitted]="submitted"
        [hint]="'clients.form.phoneHint' | transloco"
        [messages]="messages.phone"
      />
      <app-form-field
        fieldId="email"
        [label]="'common.fields.emailAddress' | transloco"
        type="email"
        [control]="form.controls.email"
        [maxlength]="100"
        [submitted]="submitted"
        [messages]="messages.email"
      />
      <app-form-field
        fieldId="profilePhoto"
        [label]="'clients.form.profilePhoto' | transloco"
        type="url"
        [control]="form.controls.profilePhoto"
        [maxlength]="500"
        [submitted]="submitted"
        [messages]="messages.profilePhoto"
        [required]="false"
      />
    </div>
  </section>
  @if (isCreateMode) {
    <section class="fields-group" aria-labelledby="password-title">
      <h2 id="password-title">{{ 'account.passwordTitle' | transloco }}</h2>
      <app-form-field
        fieldId="password"
        [label]="'common.fields.password' | transloco"
        type="password"
        [control]="form.controls.password"
        [maxlength]="255"
        [submitted]="submitted"
        [hint]="'account.passwordHint' | transloco"
        [error]="'validation.password.invalid' | transloco"
      />
    </section>
  } @else {
    <p class="section-description">{{ 'account.passwordKept' | transloco }}</p>
  }
}
