<section aria-labelledby="type-data-title">
  <h2 class="section-title" id="type-data-title">Commercial information</h2>
  <p class="section-description">
    Display name, description, base rate, and permitted occupancy.
  </p>
  <div class="form-grid">
    <app-form-field
      fieldId="name"
      label="Name"
      [control]="form.controls.name"
      [maxlength]="50"
      [submitted]="submitted"
      [error]="
        form.controls.name.hasError('duplicate')
          ? 'A room type with this name already exists.'
          : 'Enter a name of up to 50 characters.'
      "
    />
    <app-form-field
      fieldId="maxCapacity"
      label="Maximum capacity"
      type="number"
      [control]="form.controls.maxCapacity"
      [min]="1"
      [max]="10"
      [step]="1"
      [submitted]="submitted"
      error="Enter a whole number from 1 to 10."
    />
    <app-form-field
      class="full-width"
      fieldId="description"
      label="Description"
      [multiline]="true"
      [control]="form.controls.description"
      [maxlength]="500"
      hint="Maximum 500 characters."
      [submitted]="submitted"
      error="Enter a description of up to 500 characters."
    />
    <app-form-field
      fieldId="nightlyPrice"
      label="Price per night (COP)"
      type="number"
      prefix="$"
      [control]="form.controls.nightlyPrice"
      [min]="0"
      [step]="0.01"
      [submitted]="submitted"
      error="Enter a price equal to or greater than zero."
    />
  </div>
</section>
