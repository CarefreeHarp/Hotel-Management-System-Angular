<app-header [solid]="true" />

<main class="room-type-page">
  <div class="room-type-page__container">
    @if (roomType(); as type) {
      <app-page-heading [title]="type.name" description="Shared gallery and commercial information for rooms in this category.">
        <a appButton [routerLink]="['/room-types', type.roomTypeId, 'edit']">Edit room type</a>
      </app-page-heading>
      @if (saved()) { <p class="saved-alert" role="status">Room type saved successfully.</p> }
      <app-room-type-info [roomType]="type" />
      @if (type.secondaryPhotos.length) {
        <app-room-type-gallery [name]="type.name" [photos]="type.secondaryPhotos" />
      }
    }
  </div>
</main>
