<app-admin-header />
<main class="catalog-page">
  <div class="catalog-page__container">
    @if (isLoading) {
      <p class="loading-state" role="status">Loading operator…</p>
    } @else {
      @if (item; as operator) {
        <app-page-heading
          eyebrow="Operator profile"
          [title]="operator.name + ' ' + operator.lastName"
          description="Account details and reporting line registered in the portal."
          ><a
            appButton
            [routerLink]="[base, 'operators', operator.operatorId, 'edit']"
            >Edit operator</a
          ></app-page-heading
        >
        @if (saved) {
          <p class="saved-alert" role="status">Operator saved successfully.</p>
        }
        <app-operator-info [operator]="operator" />
      } @else {
        <app-page-heading
          eyebrow="Staff management"
          title="Operator not found"
          description="This operator does not exist or could not be loaded. Make sure the Spring Boot backend is running."
          ><a appButton [routerLink]="[base, 'operators']">Back to list</a></app-page-heading
        >
      }
    }
  </div>
</main>
