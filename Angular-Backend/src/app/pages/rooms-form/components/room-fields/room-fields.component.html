<section [formGroup]="form" aria-labelledby="information-title">
  <h2 id="information-title">Room information</h2>
  <p class="section-description">
    All fields are required. The room number must be unique.
  </p>
  <div class="form-grid">
    <app-form-field
      fieldId="number"
      label="Room number"
      type="number"
      [control]="form.controls.number"
      [min]="1"
      [max]="2147483647"
      [step]="1"
      [submitted]="submitted"
      [error]="error(form.controls.number)"
    />
    <app-form-field
      fieldId="floor"
      label="Floor"
      type="number"
      [control]="form.controls.floor"
      [min]="-2147483648"
      [max]="2147483647"
      [step]="1"
      [submitted]="submitted"
      [error]="error(form.controls.floor)"
    />
    <div class="select-field">
      <label for="status">Status <span aria-hidden="true">*</span></label>
      <select
        id="status"
        formControlName="status"
        required
        [attr.aria-invalid]="invalid(form.controls.status)"
        aria-describedby="status-error"
      >
        @for (status of statuses; track status) {
          <option [ngValue]="status">
            {{
              status === "AVAILABLE"
                ? "Available"
                : status === "OCCUPIED"
                  ? "Occupied"
                  : "Maintenance"
            }}
          </option>
        }
      </select>
      @if (invalid(form.controls.status)) {
        <small id="status-error" role="alert">Select a status.</small>
      }
    </div>
    <div class="select-field">
      <label for="roomTypeId"
        >Room type <span aria-hidden="true">*</span></label
      >
      <select
        id="roomTypeId"
        formControlName="roomTypeId"
        required
        [attr.aria-invalid]="invalid(form.controls.roomTypeId)"
        aria-describedby="roomTypeId-error"
      >
        <option [ngValue]="null" disabled>Select a room type</option>
        @for (type of roomTypes; track type.roomTypeId) {
          <option [ngValue]="type.roomTypeId">{{ type.name }}</option>
        }
      </select>
      @if (invalid(form.controls.roomTypeId)) {
        <small id="roomTypeId-error" role="alert"
          >Select an existing room type.</small
        >
      }
    </div>
  </div>
</section>
