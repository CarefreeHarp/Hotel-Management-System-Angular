<section aria-labelledby="dates-title"><p class="eyebrow">Step 1 · Your stay</p><h2 id="dates-title">Dates of stay</h2>
<form (ngSubmit)="submit()"><div class="grid"><label>Check-in<input type="date" name="checkIn" [(ngModel)]="checkIn" [min]="today" required /></label><label>Check-out<input type="date" name="checkOut" [(ngModel)]="checkOut" [min]="checkIn || today" required /></label><label>Guests<input type="number" name="guests" [(ngModel)]="guests" min="1" step="1" required /></label></div>
<nav class="actions" aria-label="Calendar months"><button type="button" (click)="changeMonth(-1)">← Previous month</button><button type="button" (click)="changeMonth(1)">Next month →</button></nav>
<div class="grid calendars">@for(month of months();track month.title){<section [attr.aria-label]="month.title"><h3>{{month.title}}</h3><div class="calendar">@for(day of ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];track day){<span>{{day}}</span>}@for(day of month.days;track day.value){<button type="button" [disabled]="day.disabled" [attr.aria-label]="day.value" [attr.aria-pressed]="day.value===checkIn || day.value===checkOut" [class.selected]="day.value===checkIn || day.value===checkOut" [class.in-range]="checkIn && checkOut && day.value>checkIn && day.value<checkOut" (click)="chooseDate(day.value)">{{day.label}}</button>}</div></section>}</div>
<p>Choose a check-in date, then a check-out date.</p><button type="submit" [disabled]="!valid()">Check availability →</button></form></section>
